name: Sync bangs

# GitHub cron has no "every 14 days", so this runs on the 1st and 15th.
on:
  schedule:
    - cron: "0 6 1,15 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      BRANCH: sync-bangs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No install step: the script has no dependencies.
      # `shell: bash` opts into pipefail, without which `tee` would swallow a
      # failed sync and let the job open a PR against a half-written file.
      - name: Sync from DuckDuckGo
        shell: bash
        run: node scripts/sync-bangs.mjs | tee summary.txt

      - name: Check for changes
        id: check
        run: git diff --quiet src/bang.ts || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open or update pull request
        if: steps.check.outputs.changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add src/bang.ts
          git commit -m "sync bangs from DuckDuckGo"
          git push --force origin "$BRANCH"

          if [ "$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')" = "0" ]; then
            gh pr create \
              --head "$BRANCH" \
              --title "Sync bangs from DuckDuckGo" \
              --body "$(printf 'Automated refresh of `src/bang.ts`.\n\n```\n%s\n```\n' "$(cat summary.txt)")"
          fi
